<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubik's Cube Timer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
  #time { font-size: 5rem; margin: 60px 0 10px; font-variant-numeric: tabular-nums; }
  #time.ready { color: #4caf50; }
  #time.holding { color: #e53935; }
  #hint { color: #aaa; margin-bottom: 30px; }
  #times { max-width: 320px; margin: 0 auto; text-align: left; }
  #times li { padding: 4px 0; border-bottom: 1px solid #333; }
  button { background: #333; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 4px; }
  #stats { color: #ccc; margin: 20px 0; }
</style>
</head>
<body>
  <h1>Rubik's Cube Timer</h1>
  <div id="time">0.00</div>
  <div id="hint">Houd SPATIE ingedrukt, laat los om te starten, druk op spatie om te stoppen. (Op telefoon: tik op het scherm.)</div>
  <div id="stats"></div>
  <button id="clear">Wis alle tijden</button>
  <ol id="times"></ol>

<script>
  const timeEl = document.getElementById("time");
  const listEl = document.getElementById("times");
  const statsEl = document.getElementById("stats");
  let state = "idle"; // idle, holding, ready, running
  let startTime = 0, raf = null, holdTimer = null;
  let solves = [];

  try { solves = JSON.parse(localStorage.getItem("solves") || "[]"); } catch (e) { solves = []; }

  function fmt(ms) { return (ms / 1000).toFixed(2); }

  function render() {
    listEl.innerHTML = "";
    solves.slice().reverse().forEach(t => {
      const li = document.createElement("li");
      li.textContent = fmt(t) + " s";
      listEl.appendChild(li);
    });
    if (solves.length) {
      const best = Math.min(...solves);
      const avg = solves.reduce((a, b) => a + b, 0) / solves.length;
      statsEl.textContent = "Beste: " + fmt(best) + " s  |  Gemiddeld: " + fmt(avg) + " s  |  Aantal: " + solves.length;
    } else {
      statsEl.textContent = "";
    }
  }

  function tick() {
    timeEl.textContent = fmt(performance.now() - startTime);
    raf = requestAnimationFrame(tick);
  }

  function press() {
    if (state === "running") {
      cancelAnimationFrame(raf);
      const t = performance.now() - startTime;
      timeEl.textContent = fmt(t);
      solves.push(t);
      try { localStorage.setItem("solves", JSON.stringify(solves)); } catch (e) {}
      state = "idle";
      render();
    } else if (state === "idle") {
      state = "holding";
      timeEl.className = "holding";
      holdTimer = setTimeout(() => {
        state = "ready";
        timeEl.className = "ready";
      }, 400);
    }
  }

  function release() {
    if (state === "ready") {
      timeEl.className = "";
      state = "running";
      startTime = performance.now();
      tick();
    } else if (state === "holding") {
      clearTimeout(holdTimer);
      timeEl.className = "";
      state = "idle";
    }
  }

  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !e.repeat) { e.preventDefault(); press(); }
  });
  document.addEventListener("keyup", e => {
    if (e.code === "Space") { e.preventDefault(); release(); }
  });
  document.addEventListener("touchstart", e => {
    if (e.target.tagName !== "BUTTON") { e.preventDefault(); press(); }
  }, { passive: false });
  document.addEventListener("touchend", e => {
    if (e.target.tagName !== "BUTTON") { e.preventDefault(); release(); }
  }, { passive: false });

  document.getElementById("clear").addEventListener("click", () => {
    solves = [];
    try { localStorage.removeItem("solves"); } catch (e) {}
    timeEl.textContent = "0.00";
    render();
  });

  render();
</script>
</body>
</html>

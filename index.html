<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubik's Cube Timer</title>
<style>
  :root {
    --bg: #111111;
    --text: #ffffff;
    --ready: #4caf50;
    --holding: #e53935;
    --muted: #999999;
    --panel: rgba(128, 128, 128, 0.15);
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); text-align: center; margin: 0; padding: 20px; min-height: 100vh; }
  h1 { margin: 0 0 10px; font-size: 1.5rem; }
  #scramble { font-size: 1.4rem; line-height: 1.5; max-width: 800px; margin: 20px auto; letter-spacing: 1px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #cube { position: fixed; right: 16px; bottom: 16px; width: min(170px, 40vw); }
  #cube svg { width: 100%; height: auto; display: block; }
  #time { font-size: 5.5rem; margin: 30px 0 10px; font-variant-numeric: tabular-nums; }
  #time.ready { color: var(--ready); }
  #time.holding { color: var(--holding); }
  #stats { color: var(--muted); margin: 20px auto; max-width: 600px; line-height: 1.6; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--muted); padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 4px; font-size: 0.95rem; }
  button:hover { border-color: var(--text); }
  details { position: fixed; top: 12px; right: 12px; z-index: 10; text-align: left; }
  summary { display: block; width: fit-content; margin-left: auto; list-style: none; cursor: pointer; user-select: none;
            font-size: 0.8rem; padding: 6px 12px; border: 1px solid var(--muted); border-radius: 6px; background: var(--panel); color: var(--text); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { border-color: var(--text); }
  .panel { width: 320px; max-width: calc(100vw - 24px); max-height: 80vh; overflow-y: auto; margin-top: 6px;
           padding: 4px 14px 12px; background: var(--bg); border: 1px solid var(--muted); border-radius: 8px; font-size: 0.9rem; }
  .panel button { padding: 6px 10px; font-size: 0.85rem; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin: 12px 0; gap: 8px 12px; }
  input[type="color"] { width: 50px; height: 30px; border: 0; background: none; padding: 0; cursor: pointer; }
  input[type="range"] { width: 150px; }
  #times { max-width: 440px; margin: 20px auto 150px; text-align: left; padding-left: 40px; }
  #times li { padding: 8px 0; border-bottom: 1px solid var(--panel); }
  .solveRow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .solveTime { flex: 1 1 120px; font-variant-numeric: tabular-nums; }
  #times button { padding: 3px 8px; font-size: 0.8rem; margin: 0; }
  #times button.on { background: var(--text); color: var(--bg); }
  .scrambleBox { margin: 8px 0 2px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; line-height: 1.6; color: var(--muted); }
  .scrambleBox button { display: block; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Rubik's Cube Timer</h1>

  <div id="scramble"></div>
  <button id="newScramble">Nieuwe scramble</button>

  <div id="cube"></div>

  <div id="time">0.00</div>
  <div id="stats"></div>

  <details>
    <summary>&#9881; Instellingen</summary>
    <div class="panel">
    <div class="row">
      <label for="inspection">Inspectietijd van 15 seconden</label>
      <input type="checkbox" id="inspection">
    </div>
    <div class="row">
      <label for="hideTime">Verberg tijd tijdens solve</label>
      <input type="checkbox" id="hideTime">
    </div>
    <div class="row">
      <label for="cBg">Achtergrondkleur</label>
      <input type="color" id="cBg">
    </div>
    <div class="row">
      <label for="cText">Tekstkleur</label>
      <input type="color" id="cText">
    </div>
    <div class="row">
      <label for="cReady">Kleur "klaar om te starten"</label>
      <input type="color" id="cReady">
    </div>
    <div class="row">
      <label for="cHolding">Kleur "vasthouden"</label>
      <input type="color" id="cHolding">
    </div>
    <div class="row">
      <label for="timeSize">Grootte van de tijd</label>
      <input type="range" id="timeSize" min="3" max="9" step="0.5">
    </div>
    <div class="row">
      <label>Thema's</label>
      <span>
        <button data-theme="dark">Donker</button>
        <button data-theme="light">Licht</button>
        <button data-theme="cube">Cube</button>
      </span>
    </div>
    <button id="resetSettings">Standaardinstellingen</button>
    </div>
  </details>

  <button id="clear">Wis alle tijden</button>
  <ol id="times" reversed></ol>

<script>
  // ---------- Elementen ----------
  const timeEl = document.getElementById("time");
  const listEl = document.getElementById("times");
  const statsEl = document.getElementById("stats");
  const scrambleEl = document.getElementById("scramble");
  const cubeEl = document.getElementById("cube");
  const root = document.documentElement;

  // ---------- Opslag (veilig, werkt ook als opslag geblokkeerd is) ----------
  function load(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // ---------- Scramble ----------
  const FACES = ["R", "L", "U", "D", "F", "B"];
  const AXIS = { R: 0, L: 0, U: 1, D: 1, F: 2, B: 2 };
  const MODS = ["", "'", "2"];

  function generateScramble(length = 20) {
    const moves = [];
    while (moves.length < length) {
      const face = FACES[Math.floor(Math.random() * FACES.length)];
      const last = moves.length ? moves[moves.length - 1][0] : null;
      const beforeLast = moves.length > 1 ? moves[moves.length - 2][0] : null;
      if (face === last) continue; // nooit twee keer dezelfde kant na elkaar
      // geen drie zetten op dezelfde as (bijv. R L R)
      if (last && beforeLast && AXIS[face] === AXIS[last] && AXIS[last] === AXIS[beforeLast]) continue;
      moves.push(face + MODS[Math.floor(Math.random() * MODS.length)]);
    }
    return moves.join(" ");
  }

  // ---------- 2D afbeelding van de cube ----------
  // Cube vastgehouden met wit onder en groen voor:
  // boven = geel, onder = wit, voor = groen, achter = blauw, rechts = oranje, links = rood
  const COLORS = { U: "#ffd500", D: "#ffffff", F: "#009b48", B: "#0046ad", R: "#ff5800", L: "#c41e3a" };
  const NORMAL_FACE = { "0,1,0": "U", "0,-1,0": "D", "0,0,1": "F", "0,0,-1": "B", "1,0,0": "R", "-1,0,0": "L" };
  // Voor elke zet: op welke as en welke laag hij werkt
  const LAYER = { R: [0, 1], L: [0, -1], U: [1, 1], D: [1, -1], F: [2, 1], B: [2, -1] };

  // 54 stickers: positie (x, y, z) en richting (normaal) van elk sticker
  function solvedStickers() {
    const stickers = [];
    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const pos = [x, y, z];
          for (let axis = 0; axis < 3; axis++) {
            if (pos[axis] !== 0) {
              const n = [0, 0, 0];
              n[axis] = pos[axis];
              stickers.push({ pos: pos.slice(), n: n, color: COLORS[NORMAL_FACE[n.join(",")]] });
            }
          }
        }
      }
    }
    return stickers;
  }

  // Een kwartslag met de klok mee (gezien vanaf de buitenkant van die kant)
  function rotVec(v, face) {
    const x = v[0], y = v[1], z = v[2];
    switch (face) {
      case "R": return [x, z, -y];
      case "L": return [x, -z, y];
      case "U": return [-z, y, x];
      case "D": return [z, y, -x];
      case "F": return [y, -x, z];
      case "B": return [-y, x, z];
    }
  }

  function applyMove(stickers, face, turns) {
    const axis = LAYER[face][0], value = LAYER[face][1];
    for (let i = 0; i < turns; i++) {
      for (const s of stickers) {
        if (s.pos[axis] === value) {
          s.pos = rotVec(s.pos, face);
          s.n = rotVec(s.n, face);
        }
      }
    }
  }

  function parseMove(token) {
    const turns = token[1] === "'" ? 3 : token[1] === "2" ? 2 : 1;
    return [token[0], turns];
  }

  // Op welke plek in het kruisvormige plaatje (kolom, rij) hoort een sticker
  function netCell(s) {
    const x = s.pos[0], y = s.pos[1], z = s.pos[2];
    switch (NORMAL_FACE[s.n.join(",")]) {
      case "U": return [3 + (x + 1), 0 + (z + 1)];
      case "L": return [0 + (z + 1), 3 + (1 - y)];
      case "F": return [3 + (x + 1), 3 + (1 - y)];
      case "R": return [6 + (1 - z), 3 + (1 - y)];
      case "B": return [9 + (1 - x), 3 + (1 - y)];
      case "D": return [3 + (x + 1), 6 + (1 - z)];
    }
  }

  function renderCube(scramble) {
    const stickers = solvedStickers();
    scramble.split(" ").filter(Boolean).forEach(tok => {
      const m = parseMove(tok);
      applyMove(stickers, m[0], m[1]);
    });
    const S = 20;
    let svg = '<svg viewBox="0 0 ' + (12 * S) + ' ' + (9 * S) + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cube na de scramble">';
    stickers.forEach(s => {
      const c = netCell(s);
      svg += '<rect x="' + (c[0] * S + 1) + '" y="' + (c[1] * S + 1) + '" width="' + (S - 2) + '" height="' + (S - 2) +
             '" rx="3" fill="' + s.color + '" stroke="#000" stroke-width="1.2"/>';
    });
    svg += "</svg>";
    cubeEl.innerHTML = svg;
  }

  let currentScramble = "";

  function setScramble(scr) {
    currentScramble = scr;
    scrambleEl.textContent = scr;
    renderCube(scr);
  }

  function newScramble() {
    setScramble(generateScramble());
  }

  // ---------- Instellingen ----------
  const DEFAULTS = {
    hideTime: false,
    inspection: false,
    bg: "#111111",
    text: "#ffffff",
    ready: "#4caf50",
    holding: "#e53935",
    timeSize: 5.5
  };
  const THEMES = {
    dark:  { bg: "#111111", text: "#ffffff", ready: "#4caf50", holding: "#e53935" },
    light: { bg: "#f5f5f5", text: "#222222", ready: "#2e7d32", holding: "#c62828" },
    cube:  { bg: "#0d47a1", text: "#ffffff", ready: "#ffd600", holding: "#ff6d00" }
  };
  let settings = Object.assign({}, DEFAULTS, load("settings", {}));

  const inputs = {
    hideTime: document.getElementById("hideTime"),
    inspection: document.getElementById("inspection"),
    bg: document.getElementById("cBg"),
    text: document.getElementById("cText"),
    ready: document.getElementById("cReady"),
    holding: document.getElementById("cHolding"),
    timeSize: document.getElementById("timeSize")
  };

  function applySettings() {
    root.style.setProperty("--bg", settings.bg);
    root.style.setProperty("--text", settings.text);
    root.style.setProperty("--ready", settings.ready);
    root.style.setProperty("--holding", settings.holding);
    timeEl.style.fontSize = settings.timeSize + "rem";
    inputs.hideTime.checked = settings.hideTime;
    inputs.inspection.checked = settings.inspection;
    inputs.bg.value = settings.bg;
    inputs.text.value = settings.text;
    inputs.ready.value = settings.ready;
    inputs.holding.value = settings.holding;
    inputs.timeSize.value = settings.timeSize;
    save("settings", settings);
  }

  ["hideTime", "inspection"].forEach(k => {
    inputs[k].addEventListener("change", e => {
      settings[k] = e.target.checked;
      applySettings();
      e.target.blur(); // zodat spatie de timer blijft bedienen
    });
  });
  ["bg", "text", "ready", "holding"].forEach(k => {
    inputs[k].addEventListener("input", e => { settings[k] = e.target.value; applySettings(); });
  });
  inputs.timeSize.addEventListener("input", e => {
    settings.timeSize = parseFloat(e.target.value);
    applySettings();
  });
  document.querySelectorAll("[data-theme]").forEach(btn => {
    btn.addEventListener("click", () => {
      Object.assign(settings, THEMES[btn.dataset.theme]);
      applySettings();
      btn.blur();
    });
  });
  document.getElementById("resetSettings").addEventListener("click", e => {
    settings = Object.assign({}, DEFAULTS);
    applySettings();
    e.target.blur();
  });

  // ---------- Tijden en Ao5 ----------
  // Elke solve: { ms, plus2, dnf }. Oude opgeslagen tijden (alleen getallen) worden omgezet.
  let solves = load("solves", []).map(s =>
    typeof s === "number" ? { ms: s, plus2: false, dnf: false } : s
  );

  function eff(s) { return s.dnf ? Infinity : s.ms + (s.plus2 ? 2000 : 0); }
  function fmt(ms) { return (ms / 1000).toFixed(2); }
  function fmtVal(v) { return v === Infinity ? "DNF" : fmt(v); }
  function fmtSolve(s) { return s.dnf ? "DNF" : fmt(eff(s)) + (s.plus2 ? " (+2)" : ""); }

  // Ao5 van de 5 solves die eindigen op index "end": beste en slechtste vallen weg,
  // gemiddelde van de 3 overige. Bij 2 of meer DNF's is het resultaat DNF.
  function ao5At(end) {
    const vals = solves.slice(end - 4, end + 1).map(eff).sort((a, b) => a - b);
    if (vals[3] === Infinity) return Infinity;
    return (vals[1] + vals[2] + vals[3]) / 3;
  }

  let openIdx = null; // welke solve heeft zijn scramble uitgeklapt

  function fmtLabel(s) {
    if (s.dnf) return "DNF" + (s.ms > 0 ? " (" + fmt(s.ms) + ")" : "");
    return fmt(eff(s)) + " s" + (s.plus2 ? " (+2)" : "");
  }

  function mkBtn(text, action, index, on, title) {
    const b = document.createElement("button");
    b.textContent = text;
    b.dataset.action = action;
    b.dataset.index = String(index);
    if (on) b.className = "on";
    if (title) b.title = title;
    return b;
  }

  function renderList() {
    listEl.innerHTML = "";
    for (let i = solves.length - 1; i >= 0; i--) {
      const s = solves[i];
      const li = document.createElement("li");
      const row = document.createElement("div");
      row.className = "solveRow";
      const label = document.createElement("span");
      label.className = "solveTime";
      label.textContent = fmtLabel(s);
      row.appendChild(label);
      row.appendChild(mkBtn("+2", "plus2", i, s.plus2, "Voeg 2 seconden straf toe"));
      row.appendChild(mkBtn("DNF", "dnf", i, s.dnf, "Markeer als DNF"));
      row.appendChild(mkBtn("Scramble", "scramble", i, openIdx === i, "Bekijk de scramble"));
      row.appendChild(mkBtn("\u2715", "delete", i, false, "Verwijder deze tijd"));
      li.appendChild(row);
      if (openIdx === i) {
        const box = document.createElement("div");
        box.className = "scrambleBox";
        if (s.scramble) {
          box.appendChild(document.createTextNode(s.scramble));
          box.appendChild(mkBtn("Opnieuw doen", "redo", i, false));
        } else {
          box.textContent = "De scramble van deze tijd is niet bewaard.";
        }
        li.appendChild(box);
      }
      listEl.appendChild(li);
    }
  }

  function render() {
    renderList();
    if (!solves.length) { statsEl.textContent = ""; return; }

    const finite = solves.map(eff).filter(v => v !== Infinity);
    const parts = [];
    parts.push("Beste: " + (finite.length ? fmt(Math.min(...finite)) + " s" : "-"));

    if (solves.length >= 5) {
      const current = ao5At(solves.length - 1);
      let bestAo5 = Infinity;
      for (let i = 4; i < solves.length; i++) bestAo5 = Math.min(bestAo5, ao5At(i));
      parts.push("Ao5: " + fmtVal(current) + (current === Infinity ? "" : " s"));
      parts.push("Beste Ao5: " + fmtVal(bestAo5) + (bestAo5 === Infinity ? "" : " s"));
    } else {
      parts.push("Ao5: - (nog " + (5 - solves.length) + " solves)");
    }

    if (finite.length) {
      parts.push("Gemiddeld: " + fmt(finite.reduce((a, b) => a + b, 0) / finite.length) + " s");
    }
    parts.push("Aantal: " + solves.length);
    statsEl.textContent = parts.join("  |  ");
  }

  // ---------- Timer ----------
  // Toestanden: idle, inspecting, holding, ready, running
  let state = "idle";
  let startTime = 0, inspectStart = null, penalty = 0;
  let raf = null, holdTimer = null;

  function loop() {
    const now = performance.now();
    if (state === "running") {
      timeEl.textContent = settings.hideTime ? "Solving..." : fmt(now - startTime);
    } else if (inspectStart !== null) {
      const el = (now - inspectStart) / 1000;
      if (el >= 17) { inspectionDnf(); return; }
      timeEl.textContent = el >= 15 ? "+2" : String(Math.ceil(15 - el));
    }
    raf = requestAnimationFrame(loop);
  }
  function startLoop() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function startInspection() {
    state = "inspecting";
    inspectStart = performance.now();
    timeEl.className = "";
    startLoop();
  }

  // Niet gestart binnen 17 seconden: DNF
  function inspectionDnf() {
    clearTimeout(holdTimer);
    inspectStart = null;
    state = "idle";
    timeEl.className = "";
    solves.push({ ms: 0, plus2: false, dnf: true, scramble: currentScramble });
    save("solves", solves);
    timeEl.textContent = "DNF";
    render();
    newScramble();
  }

  function beginHold() {
    state = "holding";
    timeEl.className = "holding";
    holdTimer = setTimeout(() => {
      state = "ready";
      timeEl.className = "ready";
    }, 400);
  }

  function stopSolve() {
    cancelAnimationFrame(raf);
    const t = performance.now() - startTime;
    const solve = { ms: t, plus2: penalty > 0, dnf: false, scramble: currentScramble };
    solves.push(solve);
    save("solves", solves);
    state = "idle";
    timeEl.textContent = fmtSolve(solve);
    render();
    newScramble(); // nieuwe scramble na elke solve
  }

  function press() {
    if (state === "running") {
      stopSolve();
    } else if (state === "idle") {
      if (settings.inspection) startInspection();
      else beginHold();
    } else if (state === "inspecting") {
      beginHold();
    }
  }

  function release() {
    if (state === "ready") {
      timeEl.className = "";
      penalty = 0;
      if (inspectStart !== null) {
        const el = (performance.now() - inspectStart) / 1000;
        penalty = el >= 15 ? 2000 : 0; // tussen 15 en 17 seconden: +2
        inspectStart = null;
      }
      state = "running";
      startTime = performance.now();
      startLoop();
    } else if (state === "holding") {
      clearTimeout(holdTimer);
      timeEl.className = "";
      state = inspectStart !== null ? "inspecting" : "idle";
    }
  }

  // Aanraking van knoppen, instellingen en de lijst start de timer niet (en blokkeert scrollen niet)
  function isControl(el) {
    return el.closest && el.closest("button, input, label, summary, details, #times, #stats, #cube");
  }

  // Spatie is altijd voor de timer: nooit scrollen en nooit per ongeluk een knop indrukken
  function isSpace(e) { return e.code === "Space" || e.key === " "; }
  const keyOpts = { capture: true, passive: false };
  window.addEventListener("keydown", e => {
    if (!isSpace(e)) return;
    e.preventDefault();
    if (e.repeat) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
    press();
  }, keyOpts);
  window.addEventListener("keypress", e => {
    if (isSpace(e)) e.preventDefault();
  }, keyOpts);
  window.addEventListener("keyup", e => {
    if (!isSpace(e)) return;
    e.preventDefault();
    release();
  }, keyOpts);

  // Acties bij vorige tijden: +2, DNF, scramble bekijken, opnieuw doen, verwijderen
  function refreshAfterEdit() {
    render();
    if (state === "idle") {
      timeEl.textContent = solves.length ? fmtSolve(solves[solves.length - 1]) : "0.00";
    }
  }

  function handleSolveAction(action, i) {
    const s = solves[i];
    if (!s) return;
    if (action === "plus2") {
      s.plus2 = !s.plus2;
    } else if (action === "dnf") {
      s.dnf = !s.dnf;
    } else if (action === "scramble") {
      openIdx = openIdx === i ? null : i;
    } else if (action === "delete") {
      if (!confirm("Deze tijd verwijderen?")) return;
      solves.splice(i, 1);
      if (openIdx === i) openIdx = null;
      else if (openIdx !== null && openIdx > i) openIdx--;
    } else if (action === "redo") {
      if (state !== "idle" || !s.scramble) return;
      setScramble(s.scramble);
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    save("solves", solves);
    refreshAfterEdit();
  }

  listEl.addEventListener("click", e => {
    const b = e.target.closest ? e.target.closest("button") : null;
    if (!b || !b.dataset.action) return;
    handleSolveAction(b.dataset.action, parseInt(b.dataset.index, 10));
  });
  document.addEventListener("touchstart", e => {
    if (!isControl(e.target)) { e.preventDefault(); press(); }
  }, { passive: false });
  document.addEventListener("touchend", e => {
    if (!isControl(e.target)) { e.preventDefault(); release(); }
  }, { passive: false });

  document.getElementById("newScramble").addEventListener("click", e => {
    if (state === "idle") newScramble();
    e.target.blur();
  });
  document.getElementById("clear").addEventListener("click", e => {
    solves = [];
    openIdx = null;
    save("solves", solves);
    timeEl.textContent = "0.00";
    render();
    e.target.blur();
  });

  // ---------- Start ----------
  applySettings();
  newScramble();
  render();
</script>
</body>
</html>

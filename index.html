<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b2d80;
    --bg-top: #1c5ee0;
    --text: #ffffff;
    --ready: #5be37d;
    --holding: #ff5252;
    --muted: rgba(255, 255, 255, 0.65);
    --panel: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.20);
    --side-bg: rgba(0, 0, 0, 0.25);
    --sidebar-w: clamp(300px, 23vw, 350px);
    --side-left-w: clamp(220px, 17vw, 270px);
    --pink: #ff7eb9;
    --time-size: 9rem;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: var(--text);
         background-color: var(--bg);
         background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 75%);
         background-attachment: fixed; min-height: 100vh; }
  button { font-family: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
  button:hover { border-color: var(--text); }

  /* ---------- Hoofdgedeelte ---------- */
  #main { margin-left: var(--side-left-w); margin-right: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column;
          padding: 12px 20px 6px; text-align: center; }
  #topBar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  #topRight { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  #topLeft { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
  /* drie streepjes: alleen op een smal scherm zichtbaar (op een laptop staat de balk altijd in beeld) */
  .menuBtn { display: none; flex: none; align-items: center; justify-content: center; width: 36px; height: 34px; padding: 0; margin: 0; border-radius: 10px; }
  .menuBtn svg { width: 20px; height: 20px; display: block; }
  #menuBackdrop { display: none; }
  #puzzleBar { display: inline-flex; background: var(--text); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
  #puzzleBar button { background: none; border: none; color: var(--bg); opacity: 0.7; font-weight: 700; padding: 7px 12px;
                      border-radius: 9px; font-size: 0.85rem; white-space: nowrap; }
  #puzzleBar button:hover { opacity: 1; }
  #puzzleBar button.on { background: var(--bg); color: var(--text); opacity: 1; }
  .pill { background: var(--text); color: var(--bg); border: 2px solid var(--text); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 0.8rem; }
  .pill:hover { opacity: 0.92; }
  .pill.on { background: var(--ready); border-color: var(--ready); color: #0b1020; }

  /* Instellingen: kleine ronde knop links van de inspectie-knop */
  details { position: relative; flex: none; width: 34px; height: 34px; }
  summary { list-style: none; cursor: pointer; user-select: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--text); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { border-color: var(--text); }
  .panel { position: absolute; top: 40px; right: 0; z-index: 40; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - 70px); overflow-y: auto;
           padding: 2px 12px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 0.85rem; text-align: left; }
  .panel button { padding: 5px 9px; font-size: 0.8rem; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin: 9px 0; gap: 6px 10px; }
  input[type="color"] { width: 44px; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; }
  input[type="range"] { width: 130px; }

  #center { flex: none; display: flex; flex-direction: column; align-items: center; padding: clamp(14px, 3vh, 30px) 0 0; }
  #scrambleRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 16px; width: 100%; }
  #scrambleCol { display: flex; flex-direction: column; align-items: center; justify-self: center; width: 100%; max-width: 420px; }
  #scramble { width: 100%; font-family: var(--mono); font-weight: 700; font-size: 1.3rem; line-height: 1.5;
              letter-spacing: 0.08em; white-space: pre-line; }
  #scramble.long { font-size: 1rem; letter-spacing: 0.03em; }
  #scramble.mega { font-size: 0.78rem; letter-spacing: 0.02em; }
  .link { background: none; border: none; color: var(--text); font-weight: 600; opacity: 0.85; padding: 4px 8px; font-size: 0.85rem; margin-top: 0; }
  .link:hover { opacity: 1; }

  #timeRow { margin: 0; }
  #time { font-family: var(--mono); font-weight: 800; font-size: min(calc(var(--time-size) * 0.8), 11vw); line-height: 0.95; margin: 0;
          font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #time.ready { color: var(--ready); }
  #time.holding { color: var(--holding); }
  #delta { font-family: var(--mono); font-size: 1.5rem; font-weight: 700; min-height: 2rem; font-variant-numeric: tabular-nums; }
  #delta.slower { color: #ff5252; }
  #delta.faster { color: #4cdf72; }
  #delta.even { color: var(--muted); }

  /* 2D afbeelding: rechts naast de scramble */
  #cube { flex: 0 0 auto; justify-self: end; margin-right: -10px; width: clamp(260px, 25vw, 400px); }
  #cube.mid { width: clamp(100px, 9.5vw, 150px); }
  #cube.wide { width: clamp(180px, 17vw, 260px); }
  #cube svg { width: 100%; height: auto; display: block; }

  #bottomStats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 0 8px; }
  .bs .l { font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bs .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Balk rechts ---------- */
  #side { position: fixed; top: 0; right: 0; bottom: 0; width: var(--sidebar-w); display: flex; flex-direction: column; gap: 10px;
          padding: 10px; background: var(--side-bg); z-index: 5; text-align: left; }

  /* ---------- Balk links (smaller dan de balk rechts) ---------- */
  #sideLeft { position: fixed; top: 0; left: 0; bottom: 0; width: var(--side-left-w); padding: 12px 10px; background: var(--side-bg);
              z-index: 5; text-align: left; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: none; border: none; outline: none;
           padding: 6px 8px; margin: 0; border-radius: 12px; color: var(--text); cursor: pointer; text-align: left; }
  .brand:hover { background: var(--panel); }
  .brandText { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.01em; }
  .brandLogo { width: 52px; height: 52px; display: block; }
  #sideNav { display: flex; flex-direction: column; gap: 6px; }
  .navItem { display: block; width: 100%; text-align: left; border: none; outline: none; background: transparent; color: var(--text);
             border-radius: 12px; padding: 10px 14px; margin: 0; font-size: 0.95rem; font-weight: 700; }
  .navItem:hover { background: var(--panel); }
  .navItem.active { background: var(--pink); color: #0b2a78; }

  /* Dagelijkse scramble */
  #dailyCard { flex: none; background: var(--pink); color: #0b2a78; border-radius: 14px; padding: 12px; }
  .dTop { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; }
  .dTitle { font-size: 1.1rem; font-weight: 800; line-height: 1.2; margin: 6px 0 4px; }
  .dSub { font-size: 0.72rem; opacity: 0.75; margin-bottom: 10px; min-height: 1em; }
  #dailyBtn { display: block; width: 100%; background: #0b2a78; color: #ffffff; border: none; border-radius: 10px; padding: 10px; font-weight: 800; font-size: 0.9rem; margin: 0; }
  #dailyBtn:hover { border: none; opacity: 0.92; }
  #dailyBtn:disabled { opacity: 0.45; cursor: default; }

  #bar { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .gridRow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 64px; align-items: center; column-gap: 4px; }
  #sideHead { font-size: 0.62rem; letter-spacing: 0.12em; font-weight: 700; color: var(--muted); padding: 2px 0 6px; }
  #sideHead span:nth-child(3) { text-align: right; }
  #sumLine { font-size: 0.66rem; color: var(--muted); padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #times { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; scrollbar-width: none; }
  #times::-webkit-scrollbar { display: none; }
  #times li { padding: 2px 0; border-bottom: 1px solid var(--line); }
  .solveRow { cursor: pointer; border-radius: 6px; padding: 4px; margin: 0 -4px; }
  .solveRow:hover, #times li.open .solveRow { background: var(--panel); }
  .idx { color: var(--muted); font-size: 0.68rem; }
  .solveTime { font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .solveTime.best { color: var(--ready); }
  .rowAo { text-align: right; color: var(--muted); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  .rowOpts { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 4px 26px; }
  #times button { padding: 4px 8px; font-size: 0.7rem; border-radius: 7px; white-space: nowrap; }
  #times button.on { background: var(--text); color: var(--bg); }
  .scrambleBox { margin: 2px 0 4px 26px; font-family: var(--mono); font-size: 0.7rem; line-height: 1.5; color: var(--muted); white-space: pre-line; }
  .scrambleBox button { display: block; margin-top: 6px; }
  #clear { flex: none; width: 100%; margin: 8px 0 0; font-size: 0.8rem; padding: 6px; }


  /* ---------- Jij-knop (onderaan de linkerbalk) en de man ---------- */
  .meBtn { display: flex; align-items: center; gap: 10px; width: 100%; margin: auto 0 0; padding: 8px 12px; background: transparent;
           border: 2px solid var(--line2, rgba(255, 255, 255, 0.35)); border-radius: 10px; color: var(--text); text-align: left; cursor: pointer; outline: none; }
  .meBtn:hover { border-color: var(--pink); }
  .meBtn.active { border-color: var(--pink); background: rgba(255, 126, 185, 0.16); }
  .meText { display: flex; flex-direction: column; min-width: 0; }
  .meLabel { font-size: 1.05rem; font-weight: 800; }
  .meSub { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .man { display: block; overflow: visible; flex: none; }
  .man .bob { animation: manBob 1.3s ease-in-out infinite; }
  .man .armR { transform-origin: 36.5px 28px; animation: manWave 0.9s ease-in-out infinite; }
  .man .legL { transform-origin: 20px 42px; animation: manStepL 1.3s ease-in-out infinite; }
  .man .legR { transform-origin: 28px 42px; animation: manStepR 1.3s ease-in-out infinite; }
  .man .eyeL { transform-origin: 20.5px 14px; animation: manBlink 4s infinite; }
  .man .eyeR { transform-origin: 27.5px 14px; animation: manBlink 4s infinite; }
  @keyframes manBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
  @keyframes manWave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(24deg); } }
  @keyframes manStepL { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-7deg); } }
  @keyframes manStepR { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes manBlink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @media (prefers-reduced-motion: reduce) { .man * { animation: none !important; } }
  .meBtn.active .man .armR { animation-duration: 0.6s; }

  /* ---------- Jij-pagina: account aanmaken of inloggen ---------- */
  #viewMe { display: none; margin-left: var(--side-left-w); min-height: 100vh; padding: 28px 20px; text-align: center; }
  body[data-view="me"] #viewMe { display: block; }
  body[data-view="me"] #main, body[data-view="me"] #side { display: none; }
  .meCard { max-width: 420px; margin: 0 auto; background: var(--panel); border-radius: 16px; padding: 22px; text-align: left; }
  .meHero { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 14px; }
  .meHero h2 { margin: 4px 0 0; font-size: 1.5rem; }
  .meHero p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .meTabs { display: flex; gap: 4px; background: var(--panel); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .meTabs button { flex: 1; margin: 0; border: none; background: none; padding: 8px 10px; border-radius: 9px; font-weight: 700; font-size: 0.85rem; opacity: 0.75; }
  .meTabs button.on { background: var(--pink); color: #0b2a78; opacity: 1; }
  #meForm label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
  #meForm input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font-size: 0.95rem; color: var(--text); background: rgba(255, 255, 255, 0.10);
                  border: 1px solid var(--line); border-radius: 10px; outline: none; font-family: inherit; }
  #meForm input:focus { border-color: var(--pink); }
  .meMsg { min-height: 1.3em; font-size: 0.8rem; margin: 2px 0 8px; }
  .meMsg.err { color: #ff8a8a; }
  .meMsg.ok { color: var(--ready); }
  .meSubmit { display: block; width: 100%; margin: 0; padding: 11px; border: none; border-radius: 10px; background: var(--pink); color: #0b2a78; font-weight: 800; font-size: 0.95rem; }
  .meSubmit:hover { border: none; opacity: 0.92; }
  .meOut { background: var(--panel); color: var(--text); }
  .meNote { font-size: 0.72rem; line-height: 1.5; color: var(--muted); margin: 12px 0 0; }
  .meWelcome { font-size: 1.05rem; margin: 6px 0; text-align: center; }
  #meUserBox .meNote { text-align: center; margin-bottom: 14px; }

  .meHint { font-size: 0.72rem; margin: -4px 0 10px; min-height: 1em; color: var(--muted); }
  .meHint.ok { color: var(--ready); }
  .meHint.err { color: #ff8a8a; }

  /* ---------- Smal scherm (telefoon): geen linkerbalk ---------- */
  @media (max-width: 800px) {
    #main { margin-left: 0; margin-right: 0; min-height: 0; padding: 12px 14px; }
    #viewMe { margin-left: 0; min-height: 0; padding: 16px 14px; }
    .menuBtn { display: flex; }
    /* de linkerbalk schuift op een smal scherm van links in beeld als je op de drie streepjes drukt */
    #sideLeft { width: min(78vw, 280px); z-index: 60; background-color: var(--bg); background-image: linear-gradient(var(--side-bg), var(--side-bg));
                transform: translateX(-102%); visibility: hidden; transition: transform 0.22s ease, visibility 0.22s; box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4); }
    body.menu-open #sideLeft { transform: none; visibility: visible; }
    #menuBackdrop { display: block; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 55; background: rgba(0, 0, 0, 0.45);
                    opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
    body.menu-open #menuBackdrop { opacity: 1; pointer-events: auto; }
    #side { position: static; width: auto; max-width: 520px; margin: 8px auto 20px; background: transparent; padding: 12px 14px; }
    #times { max-height: 50vh; }
    .panel { position: fixed; top: 12px; left: 12px; right: 12px; width: auto; max-height: calc(100vh - 24px); }
    #center { padding-top: 12px; }
    #scrambleRow { display: block; }
    #scrambleCol { max-width: 100%; }
    #scramble { max-width: 100%; font-size: 1.05rem; }
    /* op een telefoon staat de afbeelding rechts van de tijd */
    #timeRow { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
    #timeBox { flex: 1 1 auto; min-width: 0; }
    #time { font-size: calc(var(--time-size) * 0.45); }
    #delta { font-size: 1.2rem; min-height: 1.6rem; }
    #cube { width: min(40vw, 200px); margin-right: 0; }
    #cube.mid { width: min(42vw, 200px); }
    #cube.wide { width: min(46vw, 230px); }
    .bs .v { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <main id="main">
    <div id="topBar">
      <div id="topLeft">
        <button id="menuBtn" class="menuBtn" aria-label="Menu" aria-expanded="false" title="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <div id="puzzleBar" role="tablist" aria-label="Kies een puzzel"></div>
      </div>
      <div id="topRight">
        <details>
          <summary title="Instellingen" aria-label="Instellingen">&#9881;</summary>
          <div class="panel">
            <div class="row">
              <label for="hideTime">Verberg tijd tijdens solve</label>
              <input type="checkbox" id="hideTime">
            </div>
            <div class="row">
              <label for="cBg">Achtergrondkleur</label>
              <input type="color" id="cBg">
            </div>
            <div class="row">
              <label for="cText">Tekstkleur</label>
              <input type="color" id="cText">
            </div>
            <div class="row">
              <label for="cReady">Kleur "klaar om te starten"</label>
              <input type="color" id="cReady">
            </div>
            <div class="row">
              <label for="cHolding">Kleur "vasthouden"</label>
              <input type="color" id="cHolding">
            </div>
            <div class="row">
              <label for="timeSize">Grootte van de tijd</label>
              <input type="range" id="timeSize" min="3" max="14" step="0.5">
            </div>
            <div class="row">
              <label>Thema's</label>
              <span>
                <button data-theme="blue">Blauw</button>
                <button data-theme="dark">Donker</button>
                <button data-theme="light">Licht</button>
                <button data-theme="cube">Cube</button>
              </span>
            </div>
            <button id="resetSettings">Standaardinstellingen</button>
          </div>
        </details>
        <button id="inspBtn" class="pill" title="Inspectietijd van 15 seconden aan of uit"></button>
      </div>
    </div>

    <div id="center">
      <div id="scrambleRow">
        <div id="scrambleCol">
          <div id="scramble"></div>
          <button id="newScramble" class="link">Nieuwe scramble &#8635;</button>
        </div>
        <div id="cube"></div>
      </div>

      <div id="timeRow">
        <div id="timeBox">
          <div id="time">0.000</div>
          <div id="delta"></div>
        </div>
      </div>
    </div>

    <div id="bottomStats">
      <div class="bs"><div class="l">Ao5</div><div class="v" id="bsAo5">-</div></div>
      <div class="bs"><div class="l">Ao12</div><div class="v" id="bsAo12">-</div></div>
      <div class="bs"><div class="l">Beste</div><div class="v" id="bsBest">-</div></div>
      <div class="bs"><div class="l">Solves</div><div class="v" id="bsSolves">0</div></div>
    </div>
  </main>

  <section id="viewMe" aria-label="Jij">
    <div class="meCard">
      <div class="meHero">
        <svg class="man manBig" viewBox="0 0 48 60" width="96" height="120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="bob"><g class="legL"><rect x="17.5" y="42" width="5" height="14" rx="2.5" fill="#0b2a78"/></g><g class="legR"><rect x="25.5" y="42" width="5" height="14" rx="2.5" fill="#0b2a78"/></g><rect x="8" y="27" width="5" height="15" rx="2.5" fill="#ffd7a8" transform="rotate(12 10.5 29)"/><rect x="14" y="24" width="20" height="20" rx="7" fill="#ff7eb9"/><g class="armR"><rect x="34" y="13" width="5" height="17" rx="2.5" fill="#ffd7a8"/></g><circle cx="24" cy="13" r="10" fill="#ffd7a8"/><path d="M14.200 11.500c0-6.200 4.200-9.500 9.800-9.500s9.800 3.300 9.800 9.500c-3-3.200-7-4.200-9.800-4.200s-6.800 1-9.800 4.200z" fill="#2b1b0e"/><circle class="eyeL" cx="20.500" cy="14" r="1.400" fill="#1a1a1a"/><circle class="eyeR" cx="27.500" cy="14" r="1.400" fill="#1a1a1a"/><path d="M20.500 18.300q3.500 3 7 0" fill="none" stroke="#1a1a1a" stroke-width="1.300" stroke-linecap="round"/></g></svg>
        <h2>Jij</h2>
        <p id="meStatus">Je bent niet ingelogd.</p>
      </div>

      <div id="meGuest">
        <div class="meTabs">
          <button type="button" id="tabLogin" class="on">Inloggen</button>
          <button type="button" id="tabSignup">Account aanmaken</button>
        </div>
        <form id="meForm" autocomplete="on" novalidate>
          <label id="meNameRow" style="display:none">Naam (moet uniek zijn)
            <input id="meNameIn" type="text" autocomplete="username" maxlength="20" autocapitalize="none" spellcheck="false">
          </label>
          <div id="meNameHint" class="meHint" style="display:none"></div>
          <label>E-mailadres
            <input id="meEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
          </label>
          <label>Wachtwoord
            <input id="mePass" type="password" autocomplete="current-password">
          </label>
          <label id="meRepeatRow" style="display:none">Herhaal wachtwoord
            <input id="mePass2" type="password" autocomplete="new-password">
          </label>
          <div id="meMsg" class="meMsg" role="status" aria-live="polite"></div>

<script>
  // ---------- Elementen ----------
  const timeEl = document.getElementById("time");
  const deltaEl = document.getElementById("delta");
  const listEl = document.getElementById("times");
  const sumEl = document.getElementById("sumLine");
  const scrambleEl = document.getElementById("scramble");
  const cubeEl = document.getElementById("cube");
  const puzzleBar = document.getElementById("puzzleBar");
  const inspBtn = document.getElementById("inspBtn");
  const bsAo5 = document.getElementById("bsAo5");
  const bsAo12 = document.getElementById("bsAo12");
  const bsBest = document.getElementById("bsBest");
  const bsSolves = document.getElementById("bsSolves");
  const dailyDate = document.getElementById("dailyDate");
  const dailyTitle = document.getElementById("dailyTitle");
  const dailySub = document.getElementById("dailySub");
  const dailyBtn = document.getElementById("dailyBtn");
  const brandBtn = document.getElementById("brandBtn");
  const navTimer = document.getElementById("navTimer");

  const meStatus = document.getElementById("meStatus");
